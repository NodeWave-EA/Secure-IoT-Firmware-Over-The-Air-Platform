services:
  shadowdb_admin:
    image: dpage/pgadmin4:9.18.0
    container_name: shadowdb_admin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shadow.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      # Tells pgAdmin where to look for pre-saved server database passwords
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '8080:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Mount the auto-import servers list
      - ./servers.json:/pgadmin4/servers.json:ro
    networks:
      - fota_network

volumes:
  pgadmin_data:

networks:
  fota_network:
    name: fota_network
    driver: bridge
    external: true
