services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: fota-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI Dashboard
    networks:
      - fota_network

networks:
  fota_network:
    name: fota_network
    driver: bridge
    external: true

